name: Frontend CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [feat/chat-with-pdf-workspace]

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser layout regression
        run: bun run test:e2e
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
