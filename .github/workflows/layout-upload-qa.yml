name: QA Layout and Upload
on:
  push:
    branches: [qa/layout-upload-sidebar-polish]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --reporter=line
      - run: bunx playwright install --with-deps webkit
      - run: bunx playwright test tests/browser/sidebar-upload-layout.spec.ts --browser=webkit --reporter=line
      - name: Store screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-upload-qa-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
